name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # 依存の脆弱性チェックは security.yml（npm audit --audit-level=high・ブロッキング）に
      # 一本化している。トリガーが同一で high は critical を含むため、ここに audit を置いても
      # security.yml の部分集合にしかならない。非ブロッキングな audit を重ねると
      # 「チェックがある」ように見えて実際には止まらないため、あえて置かない。

      - name: Generate types from Zod schemas
        run: npm run gen:types

      - name: Lint banned patterns
        run: |
          # new Date is banned in production code — use lib/datetime.ts instead
          if grep -rn 'new Date' --include='*.ts' src/ tools/ lib/ scripts/ | grep -v '\.test\.ts'; then
            echo "::error::Found 'new Date' in production code. Use dayjs from lib/datetime.ts instead."
            exit 1
          fi

      - name: Lint (Oxlint)
        run: npx oxlint src/ tools/ lib/

      - name: Format check (Biome)
        run: npx biome check --no-errors-on-unmatched src/ tools/ lib/

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Coverage threshold check
        run: npm run test:coverage
