name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # このジョブは typecheck だけでなく lint / format-check / banned-patterns / npm test /
  # test:coverage をすべて実行する。**チェック名がジョブの実態を過小に表しており**、
  # 実際にレビューで「CI でテストが走っていないのでは」と誤解された（PR #131）。
  #
  # `ci` 等への改名はブランチ保護の required check 名（`typecheck`）に影響し、
  # リポジトリ設定の更新とセットでないと PR がマージ不能になるため、名前は据え置く。
  # 改名する場合はブランチ保護の変更と同時に行うこと（#127）。
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # 依存の脆弱性チェックは security.yml（npm audit --audit-level=high・ブロッキング）に
      # 一本化している。トリガーが同一で high は critical を含むため、ここに audit を置いても
      # security.yml の部分集合にしかならない。非ブロッキングな audit を重ねると
      # 「チェックがある」ように見えて実際には止まらないため、あえて置かない。

      - name: Generate types from Zod schemas
        run: npm run gen:types

      - name: Lint banned patterns
        run: |
          # new Date is banned in production code — use lib/datetime.ts instead
          if grep -rn 'new Date' --include='*.ts' src/ tools/ lib/ scripts/ | grep -v '\.test\.ts'; then
            echo "::error::Found 'new Date' in production code. Use dayjs from lib/datetime.ts instead."
            exit 1
          fi

      - name: Lint (Oxlint)
        run: npx oxlint src/ tools/ lib/ tests/

      - name: Format check (Biome)
        run: npx biome check --no-errors-on-unmatched src/ tools/ lib/ tests/

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Coverage threshold check
        run: npm run test:coverage
