name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.5.0)'
        required: true

# Prevent concurrent releases
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

# リリース対象の tag。workflow_dispatch の入力を優先し、tag push では ref 名を使う。
#
# 旧実装は `${GITHUB_REF_NAME:-<input>}` だったが、GITHUB_REF_NAME は常に設定されるため
# `:-` のフォールバックは発動せず、workflow_dispatch では起動元ブランチ名（例: main）が
# TAG として扱われていた。
#
# **`run:` の中で `${{ }}` を直接展開しない。** workflow_dispatch の `tag` は手入力で、
# 式展開はシェルがパースする**前**に起きるため、引用符やメタ文字を含む値で任意コマンドを
# 注入できる（zizmor template-injection）。npm-publish は `id-token: write` を持つので、
# 注入されたコードは OIDC provenance に到達し得る。
# env 経由なら値はシェルに解釈されないので、`run:` からは必ず "$RELEASE_TAG" で参照する。
# `with:` はシェルではないため式のまま書いてよい。
env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ──────────────────────────────────────────────
  # 1. CI gate — re-run full checks on tag code
  # ──────────────────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch では起動時に選んだ ref と入力 tag が食い違い得る。
      # checkout を入力 tag に固定しないと、別のコードをその tag として publish できる。
      # `refs/tags/` を必ず付ける。**未修飾 ref は branch が tag より優先される**ため、
      # 修飾しないと tag と同名の branch を作るだけでガードを迂回できてしまう。
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Generate types
        run: npm run gen:types

      - name: Lint (Oxlint)
        run: npx oxlint src/ tools/ lib/ tests/

      - name: Format check (Biome)
        run: npx biome check --no-errors-on-unmatched src/ tools/ lib/ tests/

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # ──────────────────────────────────────────────
  # 2. Publish to npm
  # ──────────────────────────────────────────────
  npm-publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write   # OIDC token for npm provenance
      contents: read
    steps:
      # workflow_dispatch では起動時に選んだ ref と入力 tag が食い違い得る。
      # checkout を入力 tag に固定しないと、別のコードをその tag として publish できる。
      # `refs/tags/` を必ず付ける。**未修飾 ref は branch が tag より優先される**ため、
      # 修飾しないと tag と同名の branch を作るだけでガードを迂回できてしまう。
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install deps
        run: npm ci

      - name: Generate types (included in published files)
        run: npm run gen:types

      - name: Determine dist-tag
        id: dist-tag
        run: |
          TAG="$RELEASE_TAG"
          if echo "$TAG" | grep -qE '-(alpha|beta|rc)'; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version from tag
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version

      - name: Publish
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

  # ──────────────────────────────────────────────
  # 3. Build & push Docker image to GHCR
  # ──────────────────────────────────────────────
  docker-push:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY: ghcr.io
    steps:
      # workflow_dispatch では起動時に選んだ ref と入力 tag が食い違い得る。
      # checkout を入力 tag に固定しないと、別のコードをその tag として publish できる。
      # `refs/tags/` を必ず付ける。**未修飾 ref は branch が tag より優先される**ため、
      # 修飾しないと tag と同名の branch を作るだけでガードを迂回できてしまう。
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

      # GHCR image names must be lowercase; owner may contain uppercase after org transfer
      - name: Set image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Determine tag metadata
        id: meta
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -qE '-(alpha|beta|rc)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "tags=$REGISTRY/$IMAGE_NAME:${VERSION},$REGISTRY/$IMAGE_NAME:beta" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "tags=$REGISTRY/$IMAGE_NAME:${VERSION},$REGISTRY/$IMAGE_NAME:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.description=MCP server for bitbank cryptocurrency exchange

  # ──────────────────────────────────────────────
  # 4. Create GitHub Release
  # ──────────────────────────────────────────────
  github-release:
    needs: [npm-publish, docker-push]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Determine release metadata
        id: meta
        run: |
          TAG="$RELEASE_TAG"
          if echo "$TAG" | grep -qE '-(alpha|beta|rc)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
