pre-commit:
  parallel: true
  commands:
    gen-types:
      run: npm run gen:types
    typecheck:
      run: npm run typecheck
    lint:
      run: npx oxlint {staged_files}
      glob: "*.ts"
    format-check:
      run: npx biome check --no-errors-on-unmatched {staged_files}
      glob: "*.ts"
    banned-patterns:
      run: |
        for f in {staged_files}; do
          if grep -n 'new Date' "$f" 2>/dev/null | grep -v '// *allow-date' > /dev/null; then
            echo "ERROR: 'new Date' found in $f. Use dayjs from lib/datetime.ts instead."
            grep -n 'new Date' "$f"
            exit 1
          fi
        done
      glob: "*.ts"
      exclude: "*.test.ts"
    secrets-check:
      run: |
        for f in {staged_files}; do
          base="$(basename "$f")"
          case "$base" in
            .env.example) ;;
            .env|.env.*|*.pem|*.key|id_rsa|id_rsa.*|id_ed25519|id_ed25519.*|credentials.json)
              echo "ERROR: Potential secret file staged: $f"
              exit 1
              ;;
          esac
        done
    # 上の secrets-check はファイル名しか見ない。ソース中にベタ書きされた鍵を捕まえるため、
    # gitleaks でステージ済みの「中身」を CI と同じルールセットで走査する。
    #
    # 一度 commit すると鍵は git 履歴に残り、除去には履歴の書き換えと鍵の失効が必要になる。
    # CI (.github/workflows/security.yml) の全履歴スキャンは最終防衛線だが、そこで検知した
    # 時点で既に履歴に入っているため、その手前で止めるのがこのフックの役割。
    #
    # gitleaks 未導入の環境では警告のみでスキップする（コントリビュータの参入障壁に
    # しないため）。未導入を失敗として扱いたい場合は LEFTHOOK_REQUIRE_GITLEAKS=1 を設定する。
    gitleaks:
      run: |
        if [ "${LEFTHOOK_SKIP_GITLEAKS:-}" = "1" ]; then
          echo "WARN: gitleaks scan skipped (LEFTHOOK_SKIP_GITLEAKS=1)."
          exit 0
        fi
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "gitleaks not found — staged secret scan cannot run."
          echo "  install: brew install gitleaks  /  https://github.com/gitleaks/gitleaks#installing"
          if [ "${LEFTHOOK_REQUIRE_GITLEAKS:-}" = "1" ]; then
            echo "ERROR: LEFTHOOK_REQUIRE_GITLEAKS=1 が設定されているため commit を中断する。"
            exit 1
          fi
          echo "WARN: ローカルの秘密情報チェックが無効な状態で commit する。"
          echo "      厳格に運用する場合は LEFTHOOK_REQUIRE_GITLEAKS=1 を設定すること。"
          exit 0
        fi
        gitleaks git --staged --redact --verbose --no-banner --exit-code 1
